<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Panic &amp; Wonder</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Grenze+Gotisch:wght@600&family=EB+Garamond:wght@500&family=Abril+Fatface&family=Josefin+Sans:wght@700&family=Archivo:wght@800&family=Fraunces:opsz,wght@72,700&family=Space+Mono:wght@700&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--ground); color:var(--ink); font-family:var(--font-body); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .accent { fill:var(--accent); }
  .deep { fill:var(--ink); }
  .wonder { fill:var(--react-wonder); }
  .panic { fill:var(--react-panic); }
  .blk { rx:var(--era-radius); }
  .dot { fill:var(--accent); }
  .cut { fill:var(--ground); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--era-display); font-size:76px; line-height:.95; font-weight:600; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 144x232 bled off the top (the era's identity, largest) · ink 208x176 bled off the right · react-wonder 96x120 · react-panic 48x32 — about 30% of 960x288; every fill re-tints per era theme
  arrangement one tall accent slab with satellites, bottoms on one line (y=216), space-4 gutters
  pattern     a literal motif, the timeline itself: event dots whose gaps shrink toward the present, on the ground in accent and cut out of the blocks in ground
  scales      sides in space-4/space-6 multiples; gutters space-4; dot r = space-1; corners --era-radius (radius-none … radius-lg per era)
-->
